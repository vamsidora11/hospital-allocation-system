services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hospital_test
      POSTGRES_PASSWORD: hospital_test
      POSTGRES_DB: hospital_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospital_test -d hospital_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  chroma-test:
    image: chromadb/chroma:latest
    ports:
      - "8002:8000"
