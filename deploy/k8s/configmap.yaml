apiVersion: v1
kind: ConfigMap
metadata:
  name: hospital-allocation-config
  labels:
    app: hospital-allocation-system
data:
  APP_NAME: "hospital-allocation-system"
  ENVIRONMENT: "production"
  CHROMA_HOST: "chroma"
  CHROMA_PORT: "8000"
  GOOGLE_EMBEDDING_MODEL: "models/gemini-embedding-001"
  GOOGLE_CHAT_MODEL: "gemini-3.5-flash-lite"
  EMBEDDING_MODEL: "text-embedding-3-small"
  HUMAN_APPROVAL_THRESHOLD: "0.70"
  MAX_AGENT_RETRIES: "3"
  LANGSMITH_TRACING: "true"
