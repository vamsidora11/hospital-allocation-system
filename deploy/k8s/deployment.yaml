apiVersion: apps/v1
kind: Deployment
metadata:
  name: hospital-allocation-api
  labels:
    app: hospital-allocation-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hospital-allocation-system
  template:
    metadata:
      labels:
        app: hospital-allocation-system
    spec:
      containers:
        - name: api
          image: hospital-allocation-system:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: hospital-allocation-config
            - secretRef:
                name: hospital-allocation-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
